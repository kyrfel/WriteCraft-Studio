
name: Extract and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -q writecraft-studio-android-ready.zip -d .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: writecraft-studio
        run: npm install

      - name: Build web app
        working-directory: writecraft-studio
        run: npm run build

      - name: Generate Android
        working-directory: writecraft-studio
        run: npx cap add android

      - name: Sync Android
        working-directory: writecraft-studio
        run: npx cap sync android

      - name: Build APK
        working-directory: writecraft-studio/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WriteCraft-Studio-APK
          path: writecraft-studio/android/app/build/outputs/apk/debug/app-debug.apk
          
